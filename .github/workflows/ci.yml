name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Une nouvelle poussée annule la vérification en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend — types et tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  backend:
    name: Backend — tests et clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Les dépendances système de Tauri : webkit2gtk fournit le moteur de
      # rendu, les autres sont exigées par ses liaisons.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # dpkg et dpkg-deb sont présents sur un runner Ubuntu : les tests
      # d'intégration construisent un vrai paquet et le relisent.
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
